image: mcr.microsoft.com/dotnet/sdk:10.0

options:
  max-time: 45
  size: 2x

definitions:
  caches:
    nuget: ~/.nuget/packages

  services:
    docker:
      memory: 3072

  steps:
    - step: &ci-validation
        name: CI Validation
        oidc: true
        deployment: DEV

        runs-on:
          - self.hosted
          - linux

        services:
          - docker

        caches:
          - nuget

        script:
          - |
            if [ "${BITBUCKET_PR_DESTINATION_BRANCH:-}" != "main" ]; then
              echo "PR is not targeting main. Skipping validation."
              exit 0
            fi

          - chmod +x ci/common/*.sh ci/ecr/*.sh ci/gitops/*.sh ci/release/*.sh
          - source ./ci/common/ci.sh

        artifacts:
          - TestResults/**
          - reports/**

    - step: &dev-deploy
        name: Build, Scan and Deploy DEV
        oidc: true
        deployment: DEV

        runs-on:
          - self.hosted
          - linux

        services:
          - docker

        caches:
          - nuget

        script:
          - chmod +x ci/common/*.sh ci/ecr/*.sh ci/gitops/*.sh ci/release/*.sh
          - source ./ci/common/ci.sh
          - ./ci/ecr/publish-dev.sh
          - ./ci/gitops/update-environment.sh dev aperture-foundation reports/image-metadata.env

        artifacts:
          - TestResults/**
          - reports/**

pipelines:
  pull-requests:
    '**':
      - step: *ci-validation

  branches:
    main:
      - step: *dev-deploy

  custom:
    promote-to-qa:
      - variables:
          - name: RELEASE_VERSION
            description: "Semantic release version, for example 1.0.0"

      - step:
          name: Promote DEV Release to QA
          deployment: QA

          runs-on:
            - self.hosted
            - linux

          script:
            - chmod +x ci/common/*.sh ci/ecr/*.sh ci/gitops/*.sh ci/release/*.sh
            - ./ci/common/install-tools.sh
            - ./ci/release/promote-qa.sh

          artifacts:
            - reports/**