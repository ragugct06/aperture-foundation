image: mcr.microsoft.com/dotnet/sdk:10.0

definitions:
  caches:
    nuget: ~/.nuget/packages

  steps:
    - step: &build-scan-publish
        name: Build, Test, Scan and Publish Image
        deployment: DEV
        oidc: true
        runs-on:
          - self.hosted
          - linux
        caches:
          - nuget
        services:
          - docker
        script:
          - chmod +x ci/*.sh

          # AWS OIDC authentication
          - source ci/aws-auth.sh

          # CodeArtifact authentication + restore
          - source ci/restore.sh

          # Build and tests
          - ./ci/build.sh
          - ./ci/test.sh

          # Docker build
          - source ci/docker-build.sh

          # Image scan
          - ./ci/image-scan.sh

          # Push to ECR
          - ./ci/ecr-push.sh

pipelines:
  branches:
    feature/*:
      - step: *build-scan-publish

    main:
      - step: *build-scan-publish