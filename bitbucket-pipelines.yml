# Input-bearing custom pipelines stay local because Bitbucket shared imports do not
# reliably forward UI-entered variables. All implementation lives in the template.
image: mcr.microsoft.com/dotnet/sdk:10.0
options:
  max-time: 45
  size: 1x
definitions:
  imports:
    aperture: aperture-pipeline-templates:v1.2.0
  services:
    docker:
      memory: 2048
  steps:
    - step: &validate-config
        name: Validate Service Pipeline Configuration
        size: 1x
        runs-on: [self.hosted, linux]
        script:
          - bash ci/bootstrap.sh
          - bash .pipeline-tools/ci/run.sh validate-config
    - step: &release-step
        name: Release Action
        oidc: true
        size: 1x
        clone:
          depth: full
        runs-on: [self.hosted, linux]
        script:
          - bash ci/bootstrap.sh
        artifacts:
          - reports/**
    - step: &test-database
        name: Validate Liquibase on PostgreSQL
        runs-on: [self.hosted, linux]
        services: [docker]
        script:
          - bash ci/bootstrap.sh
          - bash .pipeline-tools/ci/run.sh test-database
    - step: &deploy-dev-app
        name: Build, Scan and Deploy DEV Application
        oidc: true
        deployment: DEV
        runs-on: [self.hosted, linux]
        services: [docker]
        caches: [nuget, trivy]
        script:
          - bash ci/bootstrap.sh
          - bash ci/deploy-dev-app.sh build
        artifacts:
          - TestResults/**
          - reports/**
  caches:
    nuget: ~/.nuget/packages
    trivy: ~/.cache/trivy
pipelines:
  pull-requests:
    '**':
      import: validate-service@aperture
  branches:
    main:
      - step: *validate-config
      - step:
          <<: *test-database
          condition:
            changesets:
              includePaths:
                - database/**
                - ci/**
                - '**/Persistence/**'
                - '*.Domain/**'
                - bitbucket-pipelines.yml
      - step:
          <<: *deploy-dev-app
          condition:
            changesets:
              excludePaths:
                - bitbucket-pipelines.yml
                - ci/bootstrap.sh
                - ci/template-version
                - README.md
                - CLAUDE.md
                - .claudecodeignore
                - .gitignore
                - scripts/**
                - database/**
  custom:
    rollback-dev-db:
      - variables:
          - name: MIGRATION_REF
            description: "Deployed release tag or full SHA containing the changes being undone"
          - name: ROLLBACK_COUNT
            default: "1"
          - name: MODE
            default: preview
            allowed-values:
              - preview
              - execute
          - name: PREVIEW_ID
            default: ""
            description: "Required for execute: identifier from the reviewed preview"
      - step: *validate-config
      - step:
          name: Rollback DEV Database
          oidc: true
          deployment: DEV
          clone:
            depth: full
          runs-on:
            - self.hosted
            - linux
          services:
            - docker
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh rollback-db dev
          artifacts:
            - reports/rollback/**

    rollback-qe-db:
      - variables:
          - name: MIGRATION_REF
            description: "Deployed release tag or full SHA containing the changes being undone"
          - name: ROLLBACK_COUNT
            default: "1"
          - name: MODE
            default: preview
            allowed-values:
              - preview
              - execute
          - name: PREVIEW_ID
            default: ""
            description: "Required for execute: identifier from the reviewed preview"
      - step: *validate-config
      - step:
          name: Rollback QE Database
          oidc: true
          deployment: QA
          clone:
            depth: full
          runs-on:
            - self.hosted
            - linux
          services:
            - docker
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh rollback-db qe
          artifacts:
            - reports/rollback/**

    rollback-uat-db:
      - variables:
          - name: MIGRATION_REF
            description: "Deployed release tag or full SHA containing the changes being undone"
          - name: ROLLBACK_COUNT
            default: "1"
          - name: MODE
            default: preview
            allowed-values:
              - preview
              - execute
          - name: PREVIEW_ID
            default: ""
            description: "Required for execute: identifier from the reviewed preview"
      - step: *validate-config
      - step:
          name: Rollback UAT Database
          oidc: true
          deployment: UAT
          clone:
            depth: full
          runs-on:
            - self.hosted
            - linux
          services:
            - docker
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh rollback-db uat
          artifacts:
            - reports/rollback/**

    rollback-prod-db:
      - variables:
          - name: MIGRATION_REF
            description: "Deployed release tag or full SHA containing the changes being undone"
          - name: ROLLBACK_COUNT
            default: "1"
          - name: MODE
            default: preview
            allowed-values:
              - preview
              - execute
          - name: PREVIEW_ID
            default: ""
            description: "Required for execute: identifier from the reviewed preview"
      - step: *validate-config
      - step:
          name: Rollback PROD Database
          oidc: true
          deployment: PROD
          clone:
            depth: full
          runs-on:
            - self.hosted
            - linux
          services:
            - docker
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh rollback-db prod
          artifacts:
            - reports/rollback/**

    create-beta-tag:
      - variables:
          - name: RELEASE_TAG
            description: "Tag to create, for example 1.0.0-beta.1"
          - name: SOURCE_REF
            description: "Full 40-character tested main commit SHA"
      - step: *validate-config
      - step:
          <<: *release-step
          name: Create BETA Release Tag (No Deployment)
          deployment: QA
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh create-tag qe
    create-rc-tag:
      - variables:
          - name: RELEASE_TAG
            description: "Tag to create, for example 1.0.0-rc.1"
          - name: SOURCE_REF
            description: "Approved beta tag, for example 1.0.0-beta.1"
      - step: *validate-config
      - step:
          <<: *release-step
          name: Create RC Release Tag (No Deployment)
          deployment: UAT
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh create-tag uat
    create-prod-tag:
      - variables:
          - name: RELEASE_TAG
            description: "Tag to create, for example 1.0.0"
          - name: SOURCE_REF
            description: "Approved RC tag, for example 1.0.0-rc.1"
      - step: *validate-config
      - step:
          <<: *release-step
          name: Create PROD Release Tag (No Deployment)
          deployment: PROD
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh create-tag prod
    migrate-dev-db:
      import: migrate-dev-db@aperture
    migrate-qe-db:
      - variables:
          - name: RELEASE_TAG
            description: "Existing release tag, for example 1.0.0-beta.1"
      - step: *validate-config
      - step:
          <<: *release-step
          name: Migrate QE Tagged Release
          deployment: QA
          services: [docker]
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh migrate-tag qe
    migrate-uat-db:
      - variables:
          - name: RELEASE_TAG
            description: "Existing release tag, for example 1.0.0-rc.1"
      - step: *validate-config
      - step:
          <<: *release-step
          name: Migrate UAT Tagged Release
          deployment: UAT
          services: [docker]
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh migrate-tag uat
    migrate-prod-db:
      - variables:
          - name: RELEASE_TAG
            description: "Existing release tag, for example 1.0.0"
      - step: *validate-config
      - step:
          <<: *release-step
          name: Migrate PROD Tagged Release
          deployment: PROD
          services: [docker]
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh migrate-tag prod
    validate-build:
      import: validate-build@aperture
    build-and-deploy-dev:
      - step: *validate-config
      - step: *test-database
      - step: *deploy-dev-app
    deploy-existing-dev-image:
      - variables:
          - name: IMAGE_COMMIT
            description: "Full application commit SHA used as the existing ECR image tag"
      - step: *validate-config
      - step:
          <<: *release-step
          name: Deploy Existing DEV Image
          deployment: DEV
          services: [docker]
          script:
            - bash ci/bootstrap.sh
            - bash ci/deploy-dev-app.sh existing
    promote-to-qe:
      - variables:
          - name: RELEASE_TAG
            description: "Existing release tag, for example 1.0.0-beta.1"
      - step: *validate-config
      - step:
          <<: *release-step
          name: Promote QE Tagged Release
          deployment: QA
          services: [docker]
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh promote qe
    promote-to-uat:
      - variables:
          - name: RELEASE_TAG
            description: "Existing release tag, for example 1.0.0-rc.1"
      - step: *validate-config
      - step:
          <<: *release-step
          name: Promote UAT Tagged Release
          deployment: UAT
          services: [docker]
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh promote uat
    promote-to-prod:
      - variables:
          - name: RELEASE_TAG
            description: "Existing release tag, for example 1.0.0"
      - step: *validate-config
      - step:
          <<: *release-step
          name: Promote PROD Tagged Release
          deployment: PROD
          services: [docker]
          script:
            - bash ci/bootstrap.sh
            - bash .pipeline-tools/ci/run.sh promote prod
