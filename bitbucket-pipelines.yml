image: mcr.microsoft.com/dotnet/sdk:10.0

definitions:
  caches:
    nuget: ~/.nuget/packages

  steps:
    - step: &validate
        name: Validate Foundation
        deployment: DEV
        oidc: true
        runs-on:
          - self.hosted
          - linux
        caches:
          - nuget
        script:
          - chmod +x ci/*.sh
          - source ci/aws-auth.sh
          - ./ci/restore.sh
          - ./ci/build.sh
          - ./ci/test.sh

pipelines:
  pull-requests:
    "**":
      - step: *validate

  branches:
    feature/*:
      - step: *validate

    main:
      - step: *validate